<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>彬彬专属导航</title>
<link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
<link rel="shortcut icon" type="image/x-icon" href="icons/favicon.ico" />
<link rel="apple-touch-icon" href="icons/favicon.ico" />
<style>
  :root{
    --ink: #0f2440;
    --ink-soft: #5b7391;
    --line: rgba(148, 178, 220, .28);
    --blue: #2563eb;
    --blue-deep: #1e40af;
    --card: rgba(255, 255, 255, .74);
  }

  *{ box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    min-height: 100vh;
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background:
      /* 静态底：蓝白金三段，颜色偏淡，主要色彩交给上面缓慢漂移的光斑 */
      radial-gradient(70% 84% at -12% -26%, rgba(32, 106, 255, .34), transparent 56%),
      radial-gradient(68% 82% at 114% -24%, rgba(255, 194, 66, .30), transparent 54%),
      linear-gradient(162deg, #dfeeff 0%, #f5faff 20%, #ffffff 46%, #fdfeff 64%, #f1f6ff 84%, #e6efff 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* ============ 动态背景：缓慢漂移的蓝/金光斑 ============ */
  .bgwrap{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .glow{
    position: absolute;
    border-radius: 50%;
    transform: translate3d(0, 0, 0);
    will-change: transform, opacity;
    backface-visibility: hidden;
    /* 4K / 超宽屏上不让光斑无限变大，控制显存占用 */
    max-width: 2100px;
    max-height: 2100px;
  }

  /* 左上：宝蓝主光 */
  .glow.g1{
    width: 82vmax; height: 82vmax; left: -30vmax; top: -40vmax;
    background: radial-gradient(closest-side, rgba(52, 122, 255, .46), rgba(52, 122, 255, .18) 54%, transparent 76%);
    animation: drift1 .75s ease-in-out infinite;
  }
  /* 右上：香槟金主光（--gold-a/b 由脚本按时段微调，越到傍晚越浓） */
  .glow.g2{
    width: 72vmax; height: 72vmax; right: -28vmax; top: -30vmax;
    background: radial-gradient(closest-side, rgba(255, 190, 60, var(--gold-a, .46)), rgba(255, 190, 60, var(--gold-b, .17)) 52%, transparent 76%);
    animation: drift2 .78s ease-in-out infinite;
  }
  /* 左下：淡蓝回流 */
  .glow.g3{
    width: 68vmax; height: 68vmax; left: 14%; bottom: -34vmax;
    background: radial-gradient(closest-side, rgba(92, 152, 255, .40), rgba(92, 152, 255, .13) 56%, transparent 78%);
    animation: drift3 .72s ease-in-out infinite;
  }
  /* 右下：金色余晖（同样吃 --gold-c，傍晚加浓） */
  .glow.g4{
    width: 54vmax; height: 54vmax; right: 2%; bottom: -24vmax;
    background: radial-gradient(closest-side, rgba(255, 212, 124, var(--gold-c, .34)), transparent 74%);
    animation: drift4 .8s ease-in-out infinite;
  }
  /* 中间：白色柔光，负责流动时的明暗过渡 */
  .glow.g5{
    width: 52vmax; height: 52vmax; left: 38%; top: 10%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, .72), rgba(255, 255, 255, 0) 72%);
    animation: drift5 .76s ease-in-out infinite;
  }

  @keyframes drift1{
    0%,100%{ transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
    32%    { transform: translate3d(13vmax, 10vmax, 0) scale(1.16); opacity: .88; }
    64%    { transform: translate3d(4vmax, 20vmax, 0) scale(1.06); opacity: 1; }
  }
  @keyframes drift2{
    0%,100%{ transform: translate3d(0, 0, 0) scale(1.06); opacity: .96; }
    36%    { transform: translate3d(-13vmax, 15vmax, 0) scale(1); opacity: .64; }
    70%    { transform: translate3d(-24vmax, 8vmax, 0) scale(1.16); opacity: 1; }
  }
  @keyframes drift3{
    0%,100%{ transform: translate3d(0, 0, 0) scale(1); }
    38%    { transform: translate3d(15vmax, -12vmax, 0) scale(1.14); }
    72%    { transform: translate3d(5vmax, -20vmax, 0) scale(1.04); }
  }
  @keyframes drift4{
    0%,100%{ transform: translate3d(0, 0, 0) scale(1.08); opacity: .92; }
    45%    { transform: translate3d(-16vmax, -12vmax, 0) scale(1); opacity: .6; }
    72%    { transform: translate3d(-6vmax, -22vmax, 0) scale(1.14); opacity: 1; }
  }
  @keyframes drift5{
    0%,100%{ transform: translate3d(-10vmax, 0, 0) scale(1); opacity: .9; }
    50%    { transform: translate3d(12vmax, 8vmax, 0) scale(1.2); opacity: .5; }
  }

  .page{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 100vh;
    max-width: 1120px;
    margin: 0 auto;
    padding: clamp(9px, 1.3vh, 18px) 24px clamp(12px, 2.2vh, 44px);
  }

  /* ============ 顶部工具条：本地应用 + 天气 ============ */
  .utility{
    position: relative;          /* 天气弹层的定位基准 */
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: clamp(4px, 1.1vh, 12px);
  }
  .utility .apps{ display: flex; gap: 8px; }

  .app,
  .weather{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 36px;
    padding: 0 13px 0 11px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 12.5px;
    letter-spacing: .02em;
    color: #40597a;
    background: rgba(255, 255, 255, .66);
    border: 1px solid rgba(255, 255, 255, .92);
    box-shadow: 0 12px 22px -20px rgba(31, 78, 156, .95), inset 0 1px 0 rgba(255, 255, 255, .9);
    backdrop-filter: blur(10px) saturate(1.1);
    white-space: nowrap;
    user-select: none;
    transition: transform .22s ease, box-shadow .25s ease, color .2s ease, background .25s ease;
  }
  .app:hover,
  .weather:hover{
    transform: translateY(-2px);
    color: #1b4ba8;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 18px 28px -20px rgba(31, 78, 156, 1);
  }
  .app:active{ transform: translateY(0) scale(.98); }
  .app:focus-visible,
  .weather:focus-visible{ outline: 2px solid rgba(59, 130, 246, .6); outline-offset: 2px; }

  .app svg{ width: 17px; height: 17px; flex: 0 0 auto; }
  .app:nth-child(1) svg{ color: #2f7de0; }
  .app:nth-child(2) svg{ color: #2f9e6d; }

  .weather{ padding: 0 13px; cursor: pointer; font-family: inherit; }
  .weather .w-ico{ display: grid; place-items: center; width: 19px; height: 19px; }
  .weather .w-ico svg{ width: 19px; height: 19px; display: block; }
  .weather .w-city{ color: #6b84a4; }
  .weather .w-temp{
    font-size: 15px;
    font-weight: 600;
    color: #14294a;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
  }
  .weather .w-desc{ color: #5b7391; }
  .weather.is-error .w-temp{ color: #8fa3bd; font-weight: 500; }

  /* 展开指示小箭头 */
  .w-caret{
    display: grid;
    place-items: center;
    width: 11px;
    height: 11px;
    margin-left: -1px;
    color: #90a7c4;
    transition: transform .3s cubic-bezier(.2,.8,.3,1), color .2s ease;
  }
  .w-caret svg{ width: 11px; height: 11px; display: block; }
  .weather[aria-expanded="true"]{ color: #1b4ba8; background: rgba(255, 255, 255, .95); }
  .weather[aria-expanded="true"] .w-caret{ transform: rotate(180deg); color: #3b82f6; }

  /* ============ 厦门 7 天预报弹层 ============ */
  .wx-pop{
    position: absolute;
    z-index: 40;
    right: 0;
    top: calc(100% + 9px);
    width: min(336px, calc(100vw - 32px));
    padding: 13px 13px 10px;
    border-radius: 18px;
    color: #22334d;
    background: rgba(255, 255, 255, .84);
    border: 1px solid rgba(255, 255, 255, .96);
    box-shadow:
      0 28px 54px -26px rgba(18, 54, 118, .55),
      0 4px 12px -6px rgba(18, 54, 118, .22),
      inset 0 1px 0 rgba(255, 255, 255, .92);
    backdrop-filter: blur(20px) saturate(1.35);
    -webkit-backdrop-filter: blur(20px) saturate(1.35);
    transform-origin: 90% 0;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-9px) scale(.975);
    transition: opacity .2s ease, transform .26s cubic-bezier(.2,.8,.3,1), visibility .26s;
    pointer-events: none;
  }
  .wx-pop.is-open{
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
  }

  .wx-pop-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 3px 10px;
    border-bottom: 1px solid rgba(148, 177, 214, .3);
  }
  .wx-pop-city{ font-size: 15px; font-weight: 700; color: #12294a; letter-spacing: .02em; line-height: 1.1; }
  .wx-pop-city small{
    display: block;
    margin-top: 3px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .06em;
    color: #7c92ad;
  }
  .wx-now{ display: flex; align-items: center; gap: 7px; }
  .wx-now .n-ico{ display: grid; place-items: center; width: 30px; height: 30px; }
  .wx-now .n-ico svg{ width: 30px; height: 30px; display: block; }
  .wx-now .n-txt{ text-align: right; }
  .wx-now .n-t{
    display: block;
    font-size: 21px;
    font-weight: 700;
    line-height: 1;
    color: #12294a;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .wx-now .n-d{ display: block; margin-top: 3px; font-size: 10.5px; color: #6b84a4; }

  .wx-days{ list-style: none; margin: 0; padding: 5px 0 3px; }
  .wx-day{
    display: grid;
    grid-template-columns: 46px 25px 1fr 108px;
    align-items: center;
    gap: 8px;
    padding: 6px 5px;
    border-radius: 11px;
  }
  .wx-day.is-today{
    background: linear-gradient(90deg, rgba(59, 130, 246, .13), rgba(59, 130, 246, .015));
    box-shadow: inset 0 0 0 1px rgba(59, 130, 246, .1);
  }
  .wx-day .d-when b{ display: block; font-size: 12.5px; font-weight: 600; color: #1f3452; line-height: 1.2; }
  .wx-day .d-when i{
    display: block;
    margin-top: 1px;
    font-style: normal;
    font-size: 9.5px;
    color: #93a8c1;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }
  .wx-day .d-ico{ display: grid; place-items: center; width: 24px; height: 24px; }
  .wx-day .d-ico svg{ width: 24px; height: 24px; display: block; }
  .wx-day .d-desc{
    min-width: 0;
    font-size: 12px;
    color: #40597a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .wx-day .d-desc em{
    font-style: normal;
    margin-left: 5px;
    font-size: 10px;
    color: #5aa0e0;
    font-variant-numeric: tabular-nums;
  }
  .wx-day .d-temp{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .wx-day .d-min{ font-size: 11.5px; color: #8ba1ba; }
  .wx-day .d-max{ font-size: 12.5px; font-weight: 600; color: #1b3454; }
  .wx-day .d-bar{
    position: relative;
    flex: 0 0 46px;
    height: 4px;
    border-radius: 99px;
    background: rgba(150, 178, 214, .3);
    overflow: hidden;
  }
  .wx-day .d-bar span{
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 99px;
    /* 蓝 → 淡蓝 → 香槟金：中间特意停在浅蓝再转暖，避免蓝金直接插值出灰 */
    background: linear-gradient(90deg, #9bcdfa, #c6defb 42%, #ffd79a);
  }
  .wx-loading{
    padding: 26px 0 24px;
    text-align: center;
    font-size: 11.5px;
    color: #8aa0ba;
  }

  /* ============ 时间区 ============ */
  .clock-wrap{ position: relative; text-align: center; }
  /* 极淡的冷色底衬：让白色字面在浅底上有层次，不至于"空心" */
  .clock-wrap::before{
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 118%;
    height: 260%;
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side,
      rgba(66, 118, 200, .13),
      rgba(66, 118, 200, .055) 46%,
      transparent 74%);
    pointer-events: none;
    z-index: 0;
  }
  .clock-wrap .clock, .clock-wrap .date-line{ position: relative; z-index: 1; }

  .clock{
    position: relative;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: .04em;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.035em;
    line-height: .92;
    font-size: clamp(44px, min(9.6vw, 11.4vh), 96px);
    /* 白色加粗字面，靠多层阴影立起来 */
    color: #fff;
    text-shadow:
      0 1px 1px rgba(26, 62, 128, .30),    /* 贴边暗影：收紧轮廓，压住背景色 */
      0 4px 10px rgba(26, 72, 148, .26),   /* 近距投影 */
      0 14px 34px rgba(26, 72, 148, .20),  /* 中距扩散 */
      0 28px 64px rgba(26, 72, 148, .12);  /* 远景柔影 */
    user-select: none;
  }
  .clock .colon{
    display: inline-block;
    transform: translateY(-.06em);
    padding: 0 .02em;
    /* 冒号随秒闪烁（1Hz，半秒亮半秒灭），相位由 JS 对齐系统时钟秒边界 */
    transition: opacity .08s linear;
  }
  .clock .colon.is-dim{ opacity: .1; }

  .date-line{
    margin-top: clamp(10px, 1.6vh, 20px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: clamp(13px, 1.4vw, 15.5px);
    letter-spacing: .06em;
    color: #4f6d92;
    user-select: none;
  }
  .date-line .pill{
    padding: 5px 13px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .72);
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow: 0 6px 18px -12px rgba(38, 84, 160, .55);
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  .date-line .pill.lunar{ color: #3f6bb5; }
  .date-line .pill.gz{ color: #7c6bb0; }

  /* ============ 搜索区 ============ */
  .search-card{
    width: 100%;
    margin: clamp(14px, 2.4vh, 28px) auto 0;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 56px;
    padding: 0 8px 0 8px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow:
      0 26px 48px -26px rgba(31, 78, 156, .48),
      0 2px 6px -2px rgba(31, 78, 156, .10),
      inset 0 1px 0 rgba(255, 255, 255, .9);
    backdrop-filter: blur(14px) saturate(1.15);
    transition: box-shadow .35s ease, transform .35s ease, border-color .35s;
  }
  .search-card:focus-within{
    transform: translateY(-1px);
    border-color: rgba(140, 180, 255, .95);
    box-shadow:
      0 30px 56px -24px rgba(37, 99, 235, .45),
      0 0 0 4px rgba(96, 150, 255, .16),
      inset 0 1px 0 rgba(255, 255, 255, .9);
  }

  /* 引擎切换 */
  .engine{
    position: relative;
    display: flex;
    flex: 0 0 auto;
    padding: 4px;
    border-radius: 999px;
    background: rgba(226, 237, 252, .82);
    box-shadow: inset 0 1px 3px rgba(45, 92, 170, .12);
  }
  .engine .thumb{
    position: absolute;
    top: 4px; left: 4px;
    width: calc(50% - 4px);
    height: calc(100% - 8px);
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 3px 10px -3px rgba(37, 99, 235, .38);
    transition: transform .32s cubic-bezier(.4, 0, .2, 1);
  }
  .engine[data-active="google"] .thumb{ transform: translateX(100%); }
  .engine button{
    position: relative;
    z-index: 1;
    flex: 1 1 0;
    min-width: 56px;
    padding: 9px 14px;
    border: 0;
    background: none;
    border-radius: 999px;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #6c86a8;
    cursor: pointer;
    transition: color .25s ease;
    white-space: nowrap;
  }
  .engine button[aria-selected="true"]{ color: #1b4ba8; font-weight: 600; }
  .engine button:focus-visible{ outline: 2px solid rgba(59,130,246,.6); outline-offset: 2px; }

  .search-card input{
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    padding: 0 6px 0 14px;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 16.5px;
    color: #14294a;
    outline: none;
    text-overflow: ellipsis;
  }
  .search-card input::placeholder{ color: #9db1cb; letter-spacing: .02em; }

  .go{
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 50px; height: 50px;
    margin-right: 2px;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: linear-gradient(160deg, #4f92f7 0%, #2563eb 52%, #1d4ed8 100%);
    box-shadow: 0 10px 20px -8px rgba(29, 78, 216, .62), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .2s ease, box-shadow .25s ease, filter .2s;
  }
  .go:hover{ transform: scale(1.04); filter: brightness(1.04); box-shadow: 0 14px 26px -9px rgba(29, 78, 216, .7); }
  .go:active{ transform: scale(.97); }
  .go svg{ width: 21px; height: 21px; display: block; }

  /* ============ 快捷网站 ============ */
  .tabs{
    display: flex;
    justify-content: center;
    gap: 4px;
    width: fit-content;
    max-width: 100%;
    margin: clamp(10px, 1.8vh, 20px) auto 0;
    padding: 5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .62);
    border: 1px solid rgba(255, 255, 255, .94);
    box-shadow: 0 14px 26px -22px rgba(31, 78, 156, .8), inset 0 1px 0 rgba(255, 255, 255, .9);
    backdrop-filter: blur(10px);
  }
  .tab{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 15px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: #5b7391;
    cursor: pointer;
    white-space: nowrap;
    transition: color .25s ease, background .3s ease, box-shadow .3s ease;
  }
  .tab .cnt{ font-size: 11px; opacity: .62; font-variant-numeric: tabular-nums; }
  .tab:hover{ color: #1b4ba8; }
  .tab.is-active{
    color: #fff;
    background: linear-gradient(160deg, #4f92f7, #2563eb);
    box-shadow: 0 9px 18px -10px rgba(29, 78, 216, .75), inset 0 1px 0 rgba(255, 255, 255, .3);
  }
  .tab.is-active .cnt{ opacity: .85; }
  .tab:focus-visible{ outline: 2px solid rgba(59, 130, 246, .6); outline-offset: 2px; }

  .shortcuts{
    --cols: 12;
    --icon: 70px;              /* 图标边长（各视图/断点在此基础上覆盖） */
    --gx: clamp(8px, 1.2vw, 16px);
    width: 100%;
    margin-top: clamp(8px, 1.4vh, 18px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(8px, 1.25vh, 16px) var(--gx);
  }
  /* 分组视图（常用 / AI / 工具箱）：列数收一点，图标跟着放大 */
  .shortcuts[data-view="group"]{ --cols: 10; --icon: 84px; }
  /* 全部视图：48 个要一屏放下，图标收小 */
  .shortcuts[data-view="all"]{ --icon: 60px; }
  .site{
    flex: 0 0 calc((100% - (var(--cols) - 1) * var(--gx)) / var(--cols) - 1px);
    min-width: 0;            /* 防止长标签（remove.photos 等）撑宽导致换行 */
  }

  .site{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    color: inherit;
    outline: none;
  }

  .icon{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: var(--icon, 70px);
    border-radius: 27%;        /* 百分比圆角，图标放大缩小时形状比例一致 */
    display: grid;
    place-items: center;

<script>
/* ======================= 农历计算（1900-2100） ======================= */

0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,

0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,

0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,

0x0d520];

const leapMonth = y => lunarInfo[y - 1900] & 0xf;
const leapDays  = y => leapMonth(y) ? ((lunarInfo[y - 1900] & 0x10000) ? 30 : 29) : 0;
const monthDays = (y, m) => (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;

function yearDays(y){
  let sum = 348;
  for (let i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
  return sum + leapDays(y);
}

function solarToLunar(y, m, d){
  let offset = (Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000;
  let i, temp = 0;
  for (i = 1900; i < 2101 && offset > 0; i++){ temp = yearDays(i); offset -= temp; }
  if (offset < 0){ offset += temp; i--; }

  const lunarYear = i;
  const leap = leapMonth(i);
  let isLeap = false;

  for (i = 1; i < 13 && offset > 0; i++){
    if (leap > 0 && i === leap + 1 && !isLeap){ --i; isLeap = true; temp = leapDays(lunarYear); }
    else { temp = monthDays(lunarYear, i); }
    if (isLeap && i === leap + 1) isLeap = false;
    offset -= temp;
  }
  if (offset === 0 && leap > 0 && i === leap + 1){
    if (isLeap) isLeap = false;
    else { isLeap = true; --i; }
  }
  if (offset < 0){ offset += temp; --i; }

  return { year: lunarYear, month: i, day: offset + 1, leap: isLeap };
}

const CN_MONTH = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const CN_NUM   = ['日','一','二','三','四','五','六','七','八','九','十'];
const CN_PRE   = ['初','十','廿','卅'];

function lunarDayName(d){
  if (d === 10) return '初十';
  if (d === 20) return '二十';
  if (d === 30) return '三十';
  return CN_PRE[Math.floor(d / 10)] + CN_NUM[d % 10];
}

const GAN     = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI     = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ANIMALS = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
const WEEK    = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

/* ======================= 时间渲染 ======================= */
const elHH = document.getElementById('hh');
const elMM = document.getElementById('mm');
const elColon = document.getElementById('colon');
const elClock = document.getElementById('clock');
const elDate = document.getElementById('dateLine');

const pad = n => String(n).padStart(2, '0');
let lastDateKey = '';

function renderClock(){
  const now = new Date();
  const hh = pad(now.getHours()), mm = pad(now.getMinutes());

  elHH.textContent = hh;
  elMM.textContent = mm;
  elClock.setAttribute('aria-label', hh + ':' + mm);

  const key = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
  if (key !== lastDateKey){
    lastDateKey = key;
    renderDate(now);
  }
}

/* 冒号闪烁：与系统秒同步的 1Hz（每半秒翻转一次），
   用“对齐到下一个 500ms 边界”的 setTimeout 自校正，不会随运行时间漂移 */
function blinkColon(){
  const now = Date.now();
  const half = Math.floor(now / 500) % 2;   // 0 = 亮，1 = 弱
  elColon.classList.toggle('is-dim', half === 1);
  setTimeout(blinkColon, 500 - (now % 500) + 6);
}

function renderDate(now){
  const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
  const l = solarToLunar(y, m, d);
  const gz = GAN[(l.year - 4) % 10] + ZHI[(l.year - 4) % 12];
  const animal = ANIMALS[(l.year - 4) % 12];

  elDate.innerHTML =
    '<span class="pill">' + y + ' 年 ' + m + ' 月 ' + d + ' 日</span>' +
    '<span class="pill">' + WEEK[now.getDay()] + '</span>' +
    '<span class="pill lunar">农历' + (l.leap ? '闰' : '') + CN_MONTH[l.month - 1] + '月' + lunarDayName(l.day) + '</span>' +
    '<span class="pill gz">' + gz + '年 · ' + animal + '</span>';
}

renderClock();
setInterval(renderClock, 1000);
blinkColon();

function wxInfo(code){
  if (code === 0) return ['sun', '晴'];
  if (code === 1) return ['partly', '晴间多云'];
  if (code === 2) return ['partly', '多云'];
  if (code === 3) return ['cloud', '阴'];
  if (code === 45 || code === 48) return ['fog', '雾'];
  if (code >= 51 && code <= 57) return ['rain', '毛毛雨'];
  if (code >= 61 && code <= 67) return ['rain', '雨'];
  if (code >= 71 && code <= 77) return ['snow', '雪'];
  if (code >= 80 && code <= 82) return ['rain', '阵雨'];
  if (code === 85 || code === 86) return ['snow', '阵雪'];
  if (code >= 95) return ['storm', '雷阵雨'];
  return ['cloud', '多云'];
}

const weatherEl = document.getElementById('weather');
const wIco  = document.getElementById('wIco');
const wTemp = document.getElementById('wTemp');
const wDesc = document.getElementById('wDesc');

const wxDaysEl   = document.getElementById('wxDays');
const wxNowIco   = document.getElementById('wxNowIco');
const wxNowTemp  = document.getElementById('wxNowTemp');
const wxNowDesc  = document.getElementById('wxNowDesc');
let wxShown = false;
let wxLastFetch = 0;
let wxOpen = false;

function renderWx(t, code){
  const info = wxInfo(code);
  const ico = WX_ICONS[info[0]] || WX_ICONS.cloud;
  const deg = Math.round(t) + '°';
  wIco.innerHTML = ico;
  wTemp.textContent = deg;
  wDesc.textContent = info[1];
  wxNowIco.innerHTML = ico;
  wxNowTemp.textContent = deg;
  wxNowDesc.textContent = info[1];
  weatherEl.classList.remove('is-error');
  weatherEl.title = '厦门 · ' + info[1] + ' ' + Math.round(t) + '°C（点击看未来 7 天）';
  wxShown = true;
}

/* ---------- 未来 7 天列表 ---------- */
const WEEK_CN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

function renderDays(daily){
  if (!daily || !Array.isArray(daily.time) || !daily.time.length) return;
  const times = daily.time;
  const codes = daily.weather_code || [];
  const maxs  = daily.temperature_2m_max || [];
  const mins  = daily.temperature_2m_min || [];
  const pops  = daily.precipitation_probability_max || [];

  // 温度条以 7 天整体区间为标尺，横向对比才有意义
  const lo = Math.min.apply(null, mins);
  const hi = Math.max.apply(null, maxs);
  const span = Math.max(hi - lo, 1);

  wxDaysEl.innerHTML = times.map((d, i) => {
    const dt = new Date(d + 'T00:00:00');
    const info = wxInfo(codes[i]);
    const mn = Math.round(mins[i]), mx = Math.round(maxs[i]);
    const left = Math.max(0, Math.min(100, (mins[i] - lo) / span * 100));
    const width = Math.max(9, Math.min((maxs[i] - mins[i]) / span * 100, 100 - left));
    const pop = typeof pops[i] === 'number' ? pops[i] : null;
    let name = WEEK_CN[dt.getDay()];
    if (i === 0) name = '今天';
    else if (i === 1) name = '明天';
    const md = (dt.getMonth() + 1) + '/' + dt.getDate();
    const tip = (dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' + info[1]
      + ' ' + mn + '°~' + mx + '°' + (pop !== null ? '，降水概率 ' + pop + '%' : '');
    return '<li class="wx-day' + (i === 0 ? ' is-today' : '') + '" title="' + tip + '">'
      +   '<span class="d-when"><b>' + name + '</b><i>' + md + '</i></span>'
      +   '<span class="d-ico" aria-hidden="true">' + (WX_ICONS[info[0]] || WX_ICONS.cloud) + '</span>'
      +   '<span class="d-desc">' + info[1]
      +     (pop !== null && pop >= 10 ? '<em>' + pop + '%</em>' : '') + '</span>'
      +   '<span class="d-temp">'
      +     '<span class="d-min">' + mn + '°</span>'
      +     '<span class="d-bar"><span style="left:' + left.toFixed(1)
      +       '%;width:' + width.toFixed(1) + '%"></span></span>'
      +     '<span class="d-max">' + mx + '°</span>'
      +   '</span>'
      + '</li>';
  }).join('');
}

function renderWxEmpty(msg){
  wxDaysEl.innerHTML = '<li class="wx-loading">' + msg + '</li>';
}

/* ---------- 展开 / 收起 ---------- */
function setWxOpen(v){
  wxOpen = !!v;
  wxPop.classList.toggle('is-open', wxOpen);
  weatherEl.setAttribute('aria-expanded', wxOpen ? 'true' : 'false');
  if (wxOpen && Date.now() - wxLastFetch > 5 * 60 * 1000) loadWx();
}
function closeWx(){
  if (!wxOpen) return false;
  setWxOpen(false);
  return true;
}

weatherEl.addEventListener('click', () => setWxOpen(!wxOpen));

// 点外部关闭：用 capture，避免被卡片内部事件吞掉
document.addEventListener('pointerdown', e => {
  if (!wxOpen) return;
  if (wxPop.contains(e.target) || weatherEl.contains(e.target)) return;
  setWxOpen(false);
}, true);

// 先用缓存顶上，避免每次打开都闪一下「加载中」
try {
  const c = JSON.parse(localStorage.getItem('nav.wx') || 'null');
  if (c && typeof c.t === 'number' && typeof c.code === 'number'){
    renderWx(c.t, c.code);
    // 缓存跨天就不再显示，免得 7 天列表日期错位；条数不足 7 条（旧缓存）也丢弃
    if (c.daily && Array.isArray(c.daily.time) && c.daily.time.length >= 7
        && c.daily.time[0] === ymd(new Date())) renderDays(c.daily);
    if (c.daily) wxLastFetch = c.ts || 0;
  }
} catch (e) {}

const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=24.4798&longitude=118.0894'
             + '&current=temperature_2m,weather_code'
             + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
             + '&timezone=Asia%2FShanghai&forecast_days=7';

async function loadWx(){
  const ctrl = new AbortController();
  const kill = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(WX_URL, { signal: ctrl.signal, cache: 'no-store' });
    const j = await res.json();
    const cur = j.current || {};
    const t = cur.temperature_2m, code = cur.weather_code;
    if (typeof t !== 'number' || typeof code !== 'number') throw new Error('数据异常');
    renderWx(t, code);
    if (j.daily && j.daily.time && j.daily.time.length) renderDays(j.daily);
    else if (!wxDaysEl.querySelector('.wx-day')) renderWxEmpty('暂无预报数据');
    wxLastFetch = Date.now();
    try {
      localStorage.setItem('nav.wx', JSON.stringify({
        t, code, daily: j.daily || null, ts: wxLastFetch
      }));
    } catch (e) {}
  } catch (e) {
    if (!wxShown){
      wTemp.textContent = '—';
      wDesc.textContent = '天气获取失败';
      weatherEl.classList.add('is-error');
    }
    if (!wxDaysEl.querySelector('.wx-day')) renderWxEmpty('预报获取失败，稍后再试');
  } finally {
    clearTimeout(kill);
  }
}

loadWx();
setInterval(loadWx, 10 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadWx(); });

/* ======================= 背景流动（连续曲线驱动） ======================= */
/* 每个光斑的位置由两条不同周期的正弦叠加给出：
     x = R1·sin(2πt/T1 + φ) + R2·sin(2πt/T2 + φ)
   y 用略不同的频率，走出一条缓慢的利萨如曲线。
   连续可导 → 没有「跳一下、停一下」，打开页面第一帧就落在曲线上，也不会闪跳。
   缩放和透明度是十几秒一次的小幅呼吸，不再每段乱抽，所以不会忽明忽暗。 */
(function drift(){
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const smooth = t => t * t * (3 - 2 * t);
  const TAU = Math.PI * 2;

  /* ---------- 金色光斑按时间走位：清晨在右 → 正午居中 → 傍晚在左 ---------- */
  const GOLD_KEYS = [[0, -1], [6, 1], [12, 0], [18, -1], [24, -1]];
  function goldPhaseAt(h){
    for (let i = 1; i < GOLD_KEYS.length; i++){
      const h1 = GOLD_KEYS[i - 1][0], v1 = GOLD_KEYS[i - 1][1];
      const h2 = GOLD_KEYS[i][0],     v2 = GOLD_KEYS[i][1];
      if (h <= h2) return v1 + (v2 - v1) * smooth(clamp01((h - h1) / (h2 - h1)));
    }
    return -1;
  }
  function goldPhase(){
    const d = new Date();
    return goldPhaseAt(d.getHours() + d.getMinutes() / 60);
  }

  // 傍晚金光照到左半边时蓝光让位，免得蓝+金叠成发灰的脏色
  function toneOf(k, ph){
    const eve = Math.max(0, -ph);
    if (k === 'g2' || k === 'g4') return 1 + 0.14 * eve;
    if (k === 'g1') return 1 - 0.62 * eve;
    if (k === 'g3') return 1 - 0.46 * eve;
    return 1;
  }

  // R/T：主、次两条正弦的振幅（vmax）与周期（秒）；s：缩放基准/振幅/周期；o：透明度基准/振幅/周期
  const P = [
    { k: 'g1', R: [9, 3],   T: [5.4, 3.2], s: [1, .06, 11],    o: [.93, .05, 17] },
    { k: 'g2', R: [11, 3.5], T: [6.2, 3.6], s: [1.06, .07, 13], o: [.82, .07, 19], gold: true, vy: 6 },
    { k: 'g3', R: [8, 3],   T: [5, 3],     s: [1, .05, 10],    o: [.9, .05, 15] },
    { k: 'g4', R: [7, 2.5], T: [5.8, 3.4], s: [1.06, .06, 14], o: [.78, .08, 21], gold: true, vy: -7 },
    { k: 'g5', R: [5, 2],   T: [4.6, 2.8], s: [1.08, .06, 12], o: [.7, .08, 18] }
  ];
  // 每次打开随机相位，画面不重复
  P.forEach(c => { c.f = [rand(0, TAU), rand(0, TAU), rand(0, TAU), rand(0, TAU), rand(0, TAU), rand(0, TAU)]; });

  const els = P.map(c => document.querySelector('.glow.' + c.k));
  let base = [], W = 0, V = 0;

  function measure(){
    W = window.innerWidth;
    V = Math.max(window.innerWidth, window.innerHeight) / 100;
    base = els.map(el => el ? el.offsetLeft + el.offsetWidth / 2 : 0);
  }

  // 相位 → 该光斑的锚点位移：正午拉到屏幕中线，傍晚拉到左侧，早上贴住自己原本的右侧位置
  function anchor(i, ph){
    const c = P[i];
    if (!c.gold || !base[i]) return [0, 0];
    const midC = W * 0.5, rightC = base[i] + V * 2, leftC = W * 0.22;
    const target = ph >= 0
      ? midC + ph * (rightC - midC)
      : midC + (-ph) * (leftC - midC);
    // 傍晚纵向收拢：g2 往下、g4 往上，两团金在左中汇成一片暖光
    return [target - base[i], (c.vy || 0) * Math.max(0, -ph) * V];
  }

  let ph = goldPhase();

  function paint(t){
    for (let i = 0; i < P.length; i++){
      const el = els[i];
      if (!el) continue;
      const c = P[i], f = c.f;
      const x = c.R[0] * Math.sin(TAU * t / c.T[0] + f[0]) + c.R[1] * Math.sin(TAU * t / c.T[1] + f[1]);
      const y = c.R[0] * Math.sin(TAU * t / c.T[0] * 0.93 + f[2]) + c.R[1] * Math.sin(TAU * t / c.T[1] * 1.07 + f[3]);
      const sc = c.s[0] + c.s[1] * Math.sin(TAU * t / c.s[2] + f[4]);
      const op = clamp01((c.o[0] + c.o[1] * Math.sin(TAU * t / c.o[2] + f[5])) * toneOf(c.k, ph));
      const a = anchor(i, ph);
      el.style.transform = 'translate3d(' + (x * V + a[0]).toFixed(1) + 'px, '
                         + (y * V + a[1]).toFixed(1) + 'px, 0) scale(' + sc.toFixed(3) + ')';
      el.style.opacity = Math.max(.2, Math.min(1, op)).toFixed(3);
    }
  }

  // 越到傍晚金色越浓（只改渐变 alpha，20 秒校准一次，肉眼看不出来）
  const wrap = document.querySelector('.bgwrap');
  function refreshGoldTint(){
    if (!wrap) return;
    const eve = Math.max(0, -ph);
    wrap.style.setProperty('--gold-a', (.46 + .17 * eve).toFixed(3));
    wrap.style.setProperty('--gold-b', (.17 + .09 * eve).toFixed(3));
    wrap.style.setProperty('--gold-c', (.34 + .15 * eve).toFixed(3));
  }

  els.forEach(el => { if (el) el.style.animation = 'none'; });   // 关掉 CSS 关键帧，交给曲线驱动
  measure();
  refreshGoldTint();
  paint(0);                     // 首帧立刻落位，不会先闪一下初始位置

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;  // 减少动效：停在上面那一帧

  // 单帧最多推进 1/15 秒：切到别的标签页、开机卡顿、窗口拖动回来时，
  // rAF 会空很久，若直接按真实间隔算，光斑会「啪」地窜出去一大段。
  const t0 = performance.now();
  let tCur = 0, last = t0;

  window.addEventListener('resize', () => { measure(); paint(tCur); }, { passive: true });
  setInterval(() => { ph = goldPhase(); refreshGoldTint(); }, 20000);

  (function loop(now){
    tCur += Math.min((now - last) / 1000, 1 / 15);
    last = now;
    paint(tCur);
    requestAnimationFrame(loop);
  })(t0);
})();
</script>
</body>
</html>
